<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WarAsset</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nocturne.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

  <nav class="nav container" id="site-nav">
    <div class="nav-logo">
      <svg class="nav-logo-mark" width="34" height="34" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <polygon points="50,8 86.4,29 86.4,71 50,92 13.6,71 13.6,29" stroke="var(--color-accent)" stroke-width="4"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(50,8) rotate(45) translate(-4.5,-4.5)"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(86.4,29) rotate(45) translate(-4.5,-4.5)"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(86.4,71) rotate(45) translate(-4.5,-4.5)"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(50,92) rotate(45) translate(-4.5,-4.5)"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(13.6,71) rotate(45) translate(-4.5,-4.5)"/>
        <rect width="9" height="9" fill="var(--color-accent)" transform="translate(13.6,29) rotate(45) translate(-4.5,-4.5)"/>
        <text class="nav-logo-mono" x="50" y="58" text-anchor="middle" fill="#fff">WA</text>
      </svg>
      <div class="nav-logo-word"><span class="nav-logo-word-war">War</span><span class="nav-logo-word-asset">Asset</span></div>
    </div>

    <div class="nav-search field">
      <svg class="nav-search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
        <line x1="11.2" y1="11.2" x2="15" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="search-input" class="input" type="text" placeholder="Search units…" autocomplete="off">
    </div>

    <div class="seg nav-filters" id="system-filter-seg">
      <label class="seg-opt"><input type="radio" name="sysfilter" value="all" checked> All</label>
      <label class="seg-opt"><input type="radio" name="sysfilter" value="40k"> 40k</label>
      <label class="seg-opt"><input type="radio" name="sysfilter" value="kill_team"> Kill Team</label>
      <label class="seg-opt"><input type="radio" name="sysfilter" value="aos"> AoS</label>
    </div>

    <div class="nav-actions">
      <span id="sync-status" class="sync-status"></span>
      <button id="sync-btn" type="button" class="btn btn-ghost">Sync BSData</button>
      <button id="add-btn" type="button" class="btn btn-primary">+ New unit</button>
    </div>

    <div class="nav-compact-toggle">
      <button type="button" class="btn btn-secondary btn-icon" id="nav-search-toggle" aria-label="Toggle search">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="11.2" y1="11.2" x2="15" y2="15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="btn btn-secondary btn-icon" id="nav-menu-toggle" aria-label="Toggle menu">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="2" y1="4.5" x2="14" y2="4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="11.5" x2="14" y2="11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </nav>

  <div class="stat-band">
    <div class="container stat-grid">
      <div>
        <div class="stat-label">Units</div>
        <div class="stat-value" id="stat-total-units">0</div>
      </div>
      <div>
        <div class="stat-label">Models</div>
        <div class="stat-value" id="stat-total-models">0</div>
      </div>
      <div>
        <div class="stat-label">Total points</div>
        <div class="stat-value" id="stat-total-points">0</div>
      </div>
      <div>
        <div class="stat-label">Painted</div>
        <div class="stat-value"><span id="stat-painted-pct">0</span>%</div>
        <div class="stat-bar"><div class="stat-bar-fill" id="stat-bar-fill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="container toolbar">
    <div class="seg" id="view-seg">
      <label class="seg-opt"><input type="radio" name="viewmode" value="grid" checked> Grid</label>
      <label class="seg-opt"><input type="radio" name="viewmode" value="list"> List</label>
    </div>
    <select id="sort-select" class="input toolbar-select">
      <option value="name">Sort: Name</option>
      <option value="points">Sort: Points</option>
      <option value="count">Sort: Count</option>
      <option value="status">Sort: Status</option>
    </select>
    <select id="role-select" class="input toolbar-select">
      <option value="all">Type: All</option>
    </select>
    <div class="toolbar-hint" id="visible-hint"></div>
  </div>

  <div class="container" id="groups-container"></div>

  <div class="empty-state" id="empty-state" hidden>
    <p>No units match your search.</p>
  </div>

  <!-- Add/Edit dialog -->
  <div class="dialog-backdrop" id="dialog-backdrop" hidden>
    <div class="dialog" id="dialog">
      <div class="dialog-title" id="dialog-title">New unit</div>
      <div id="dialog-error" class="field-hint" style="color:var(--color-neutral-300)" hidden></div>
      <div id="dialog-fields"></div>
      <div class="dialog-mode-toggle" id="dialog-mode-toggle"></div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-secondary" id="dialog-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="dialog-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Fas 3: unit detail (datasheet view) on click of a unit name -->
  <div class="dialog-backdrop" id="view-dialog-backdrop" hidden>
    <div class="dialog view-dialog" id="view-dialog">
      <div class="view-dialog-head">
        <div>
          <div class="view-dialog-name" id="view-dialog-name"></div>
          <div class="view-dialog-keywords" id="view-dialog-keywords"></div>
        </div>
        <button type="button" class="btn btn-secondary" id="view-dialog-close">Close</button>
      </div>
      <div id="view-dialog-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
